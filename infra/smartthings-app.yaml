# SmartThings API Access app for Sebastian (PLAN §13 step 2).
# Create with:  smartthings smartapps:create -O <your-default-org-id> -i infra/smartthings-app.yaml
# apiOnly.targetUrl: without a confirmed target we saw installs fail with
# server_error and uninstalls with TargetUnconfirmed. After create/update run
#   smartthings smartapps:confirm <appId>
# and the Worker answers the CONFIRMATION at /st/lifecycle (ADR-001, amended).
# No installed-apps scope: it isn't a valid API Access app scope (the Developer Center offers none),
# and an app can read its own installed app without one.
# ST_SCOPES (apps/worker/wrangler.jsonc) must be a subset of oauth.scope. The scenes scopes are
# registered here but not requested: authorize fails with server_error when they are (2026-11-05).
# appName must be globally unique and stays reserved after the app is deleted; if create fails with
# "app with this name already exists", replace the UUID suffix (e.g. `uuidgen | tr A-Z a-z`).
# Lost the client secret? Don't recreate: `smartthings smartapps:oauth:generate <appId>` issues a new pair.
displayName: Sebastian
description: Hub-first automations-as-code. Compiles typed automations to local Rules on the hub.
appName: sebastian-2e571145-623c-46c2-9d89-6c250062435e
appType: API_ONLY
classifications:
  - CONNECTED_SERVICE
singleInstance: true
principalType: LOCATION
apiOnly:
  targetUrl: https://sebastian.baltar.media/st/lifecycle
oauth:
  clientName: Sebastian
  scope:
    - r:devices:*
    - x:devices:*
    - r:hubs:*
    - r:locations:*
    - w:locations:*
    - x:locations:*
    - r:scenes:*
    - x:scenes:*
    - r:rules:*
    - w:rules:*
    - sse
  redirectUris:
    - https://sebastian.baltar.media/oauth/callback
  corsDomains:
    - https://sebastian.baltar.media
