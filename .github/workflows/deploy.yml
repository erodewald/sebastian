name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    # CI holds Cloudflare and Sentry upload credentials — never SmartThings secrets (PLAN §10).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply sebastian --remote
      # Debug IDs tie Sentry's stack traces to the source maps, so the deployed bundle must be the
      # injected one: bundle first, then deploy that file as-is.
      - name: Bundle Worker
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --outdir dist
          pnpm exec sentry-cli sourcemaps inject dist
      # A Sentry outage or a missing token must not block a deploy.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        working-directory: apps/worker
        run: pnpm exec sentry-cli sourcemaps upload --org baltar-media --project sebastian-worker dist
      - name: Deploy Worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy dist/index.js --no-bundle
